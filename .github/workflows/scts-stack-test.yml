# Install the built app onto a real, short-lived Splunk Cloud stack from SCTS
# (Splunk Cloud Testing Service) and exercise what it actually does: mint a
# deploy token, refuse callers outside limit_role, deliver the token, redact it,
# clean expired tokens. Then install a deliberately broken build onto the same
# stack and require the checks to go red, so a green run means the checks can
# fail. The stack is always deleted.
#
# Never on pull_request: SCTS allows ONE stack at a time for the whole token,
# and a fork must neither spend that nor see the token (pull_request_target
# would hand it over). Dispatch and a weekly schedule only.
#
# Provisioning takes 55 to 75 minutes, hence the long timeouts.
name: SCTS stack test

on:
  workflow_dispatch:
    inputs:
      splunk_version:
        description: "SCTS build version (blank = latest released)"
        required: false
        type: string
      reclaim_own:
        description: "On 409, delete a leftover stack that this workflow created"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "40 6 * * 3"

permissions:
  contents: read
  actions: read

# One stack at a time across every run of this workflow.
concurrency:
  group: scts-stack
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'livehybrid/splunk_app_scdeploy' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Package app
        uses: livehybrid/deploy-splunk-app-action@main
        with:
          python-version: "3.9"

  scts:
    name: functional checks on an SCTS stack
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SCTS_API_TOKEN: ${{ secrets.SCTS_API_TOKEN }}
      # Read-only use: looking up this repo's own scts-stack-<id> artefacts.
      GITHUB_TOKEN: ${{ github.token }}
      APP_ID: splunk_app_scdeploy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Expected version and package
        id: pkg
        shell: bash
        run: |
          # Recomputed from git, independently of the packaging action.
          V="1.0.0+$(git rev-parse --short HEAD)"
          P=$(ls dist/*.tar.gz | head -1)
          [[ -f "$P" ]] || { echo "::error::no package in dist/"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "package=$P" >> "$GITHUB_OUTPUT"
          echo "Package $P, expecting version $V"
          if [[ -z "${SCTS_API_TOKEN}" ]]; then
            echo "::error::The SCTS_API_TOKEN secret is not set."
            exit 1
          fi

      - name: Request a stack
        id: stack
        shell: bash
        run: |
          python3 .github/scripts/scts.py create --no-wait \
            ${{ inputs.splunk_version && format('--splunk-version {0}', inputs.splunk_version) || '' }} \
            ${{ (github.event_name == 'schedule' || inputs.reclaim_own) && '--reclaim-own' || '' }}

      # Recorded before waiting, so a later run can tell that a leftover stack
      # with this id was created here and may be reclaimed.
      - name: Record stack ownership
        if: steps.stack.outputs.stack_id != ''
        shell: bash
        run: echo "${{ steps.stack.outputs.stack_id }}" > stack-id.txt

      - uses: actions/upload-artifact@v7
        if: steps.stack.outputs.stack_id != ''
        with:
          name: scts-stack-${{ steps.stack.outputs.stack_id }}
          path: stack-id.txt
          retention-days: 5

      - name: Wait for RUNNING and credentials
        id: wait
        shell: bash
        run: python3 .github/scripts/scts.py wait "${{ steps.stack.outputs.stack_id }}" --timeout 7800 --interval 30

      - name: Probe ACS against the stack
        # Informational: scdeploy deploys via ACS on real customer stacks.
        continue-on-error: true
        shell: bash
        run: python3 .github/scripts/scts.py acs-probe "${{ steps.stack.outputs.stack_id }}"

      - name: Install the app
        id: install
        shell: bash
        run: |
          python3 .github/scripts/scts.py install "${{ steps.stack.outputs.stack_id }}" \
            --package "${{ steps.pkg.outputs.package }}" \
            --app-name "${APP_ID}" \
            --expect-version "${{ steps.pkg.outputs.version }}"

      - name: Functional checks
        shell: bash
        run: python3 .github/scripts/scts_functional.py "${{ steps.stack.outputs.stack_id }}" --tag "r${{ github.run_id }}a${{ github.run_attempt }}"

      - name: Build a mutant (delivered token corrupted)
        id: mutant
        shell: bash
        run: |
          WORK=$(mktemp -d)
          tar -xzf "${{ steps.pkg.outputs.package }}" -C "$WORK"
          F="$WORK/${APP_ID}/bin/gendeploytoken.py"
          python3 - "$F" "$WORK/${APP_ID}" "${{ steps.pkg.outputs.version }}" <<'PY'
          import json, re, sys
          path, root, version = sys.argv[1:]
          src = open(path).read()
          old = '"token": tokenObj["token"],'
          assert src.count(old) == 1, "mutation site not found"
          open(path, "w").write(src.replace(old, '"token": tokenObj["token"][::-1],'))
          mv = version + ".mutant"
          conf = root + "/default/app.conf"
          c = open(conf).read()
          c2 = c.replace("version = " + version, "version = " + mv)
          assert c2 != c, "version not found in app.conf"
          open(conf, "w").write(c2)
          man = root + "/app.manifest"
          m = json.load(open(man)); m["info"]["id"]["version"] = mv
          json.dump(m, open(man, "w"), indent=2)
          print(mv)
          PY
          MV="${{ steps.pkg.outputs.version }}.mutant"
          tar -czf "$RUNNER_TEMP/${APP_ID}-mutant.tar.gz" -C "$WORK" "${APP_ID}"
          echo "package=$RUNNER_TEMP/${APP_ID}-mutant.tar.gz" >> "$GITHUB_OUTPUT"
          echo "version=$MV" >> "$GITHUB_OUTPUT"

      - name: Mutant self-test (the checks must go red)
        shell: bash
        run: |
          python3 .github/scripts/scts.py install "${{ steps.stack.outputs.stack_id }}" \
            --package "${{ steps.mutant.outputs.package }}" \
            --app-name "${APP_ID}" \
            --expect-version "${{ steps.mutant.outputs.version }}"
          python3 .github/scripts/scts_functional.py "${{ steps.stack.outputs.stack_id }}" \
            --tag "m${{ github.run_id }}a${{ github.run_attempt }}" \
            --only command_mints_and_delivers,minted_token_listed_for_user,delivered_payload_shape,delivered_token_authenticates,output_never_contains_token \
            --expect-fail delivered_token_authenticates

      - name: Delete the stack
        if: always() && steps.stack.outputs.stack_id != ''
        shell: bash
        run: python3 .github/scripts/scts.py delete "${{ steps.stack.outputs.stack_id }}" --strict

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### SCTS stack test"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Stack | \`${{ steps.stack.outputs.stack_id }}\` |"
            echo "| Splunk | ${{ steps.wait.outputs.splunk_version }} |"
            echo "| Built | \`${{ steps.pkg.outputs.version }}\` |"
            echo "| On stack | \`${{ steps.install.outputs.installed_version }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
